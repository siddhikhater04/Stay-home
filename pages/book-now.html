<!DOCTYPE html>
<html lang="en">

<head>
    <title>Room Booking - Siddhi's HomeStay</title>
</head>

<body>
    <h1>
        <a href="./../Pages/Stay.html"><img src="../images/arrow.png" alt="Left Arrow" height="30px" /></a>
        Book Your Stay at Siddhi's HomeStay
    </h1>
    <table>
        <tr>
            <td>
                <img src="./../images/booking.png" alt="Booking Image" height="350px" />
            </td>
            <td>
                <form><br /><br />
                    <label>Full Name:</label>
                    <input type="text" placeholder="Enter your name" /><br /><br />
                    <label>Email:</label>
                    <input type="email" placeholder="Enter your email" /><br /><br />
                    <label>Phone Number:</label>
                    <input type="tel" placeholder="Enter your phone number" /><br /><br />
                    <label>Check In:</label>
                    <input type="date" placeholder="Check In Date" /><br /><br />
                    <label>Check Out:</label>
                    <input type="date" placeholder="Check Out Date" /><br /><br />
                    <label>Total Guests:</label>
                    <input type="number" placeholder="Number of Guests" value="1" /><br /><br />
                    <label>City</label>
                    <input type="text" placeholder="Enter your city" /><br /><br />
                    
                    <a href="./book-success.html">
                        <button type="button">Book Now</button>
                    </a>
                </form>
            </td>
        </tr>
    </table>
    <div>
        <div>
            <br />
            <br />
            <hr />
            <hr />
            <p style="text-align: center;">&copy; 2026 Siddhi’s Home Stay. All rights reserved.</p>

        </div>
</body>
