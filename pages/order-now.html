<!DOCTYPE html>
<html lang="en">

<head>
    <title>Food Ordering - Siddhi's HomeStay</title>
</head>

<body>
    <h1>

        Order Your Food at Siddhi's HomeStay
    </h1>
    <table>
        <tr>
            
            <td>
                <form><br /><br />
                    <label>Full Name:</label>
                    <input type="text" placeholder="Enter your name" /><br /><br />

                    <label>Phone Number:</label>
                    <input type="tel" placeholder="Enter your phone number" /><br /><br />

                    <label>Select Room:</label>
                    <select>
                        <optgroup label="Rooms">
                            <option value="basic">Basic Room</option>
                            <option value="premium">Premium Room</option>
                            <option value="luxury">Luxury Room</option>
                        </optgroup>
                    </select>
                    <br /><br />
                    <label>Select Food Quantity:</label>
                    <select>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select><br /><br />
                    <label>Add Note :</label>
                    <textarea placeholder="Enter your note"></textarea><br /><br />
                    <a href="order-done.html">
                        <button type="button">Order Now</button>
                    </a><br /><br />
                </form>
            </td>
        </tr>
    </table>
    <div>
            <br />
            <br />
            <hr />
            <hr />
            <p style="text-align: center;">&copy; 2026 Siddhi’s Home Stay. All rights reserved.</p>
            <hr />
            <hr />
        </div>
   
</body>

</html>
